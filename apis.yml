aid: prixtel
name: Prixtel
description: 'Prixtel is a French mobile virtual network operator (MVNO) founded in 2004 by
  David Charles and headquartered in Aix-en-Provence. It is known for "forfaits flexibles" —
  mobile plans whose monthly price moves automatically between published tiers according to
  the data a subscriber actually consumed, with the ceiling known in advance — and it rides
  the SFR (historically also Orange) radio network rather than owning spectrum. Prixtel serves
  roughly 300,000 to 500,000 subscribers, reported about EUR 63.5M revenue in 2024, and was
  acquired by Altice France, the owner of SFR, in June 2021 for approximately EUR 415M while
  continuing to trade under its own brand; the Serena venture attribution that surfaced this
  profile is therefore a realized exit rather than a current holding. Prixtel publishes no
  public API, no developer portal, no SDK, no webhook catalog, and no machine-readable
  contract of any kind. Its only first-party software distribution is an end-user iOS/Android
  app for consumption tracking, invoices and line management; api.prixtel.com is that app''s
  private backend and returns HTTP 404 on every probed path, including its own root.'
